<app-site-gate *ngIf="!unlocked && !publicMode" (unlocked)="unlocked = true"></app-site-gate>
<ion-app *ngIf="unlocked || publicMode">
  <ion-router-outlet></ion-router-outlet>
</ion-app>
<!-- Quiz-Show: keine schwebenden Knöpfe (Beamer-Bild, Editor-Speichern) -->
<app-chat-widget *ngIf="unlocked && !quizshow"></app-chat-widget>
<app-postfach-widget *ngIf="unlocked && !quizshow"></app-postfach-widget>
<app-melde-flagge *ngIf="unlocked || publicMode"></app-melde-flagge>
