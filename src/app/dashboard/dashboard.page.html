<ion-header [translucent]="true" class="dash-header">
  <ion-toolbar>
    <ion-title class="brand">
      <span class="brand-mark">Gleisbau</span>
      <span class="brand-sub">Lernwelt</span>
    </ion-title>
  </ion-toolbar>
  <ion-toolbar class="nav-toolbar">
    <nav class="main-nav">
      <span class="online-anzeige" *ngIf="online$ | async as n" title="In den letzten 5 Minuten aktiv"><span class="punkt"></span>{{ n }} online</span>
      <button type="button" class="skin-toggle" [class.aktiv]="zeigeSkinAuswahl" (click)="toggleSkinAuswahl()" title="Design ändern">
        <ion-icon name="settings-outline"></ion-icon>
        <span>Design</span>
      </button>
      <a *ngIf="user$ | async as u; else keinKonto" routerLink="/konto/profil" routerLinkActive="active" class="konto-link">
        <ion-icon name="person-circle-outline"></ion-icon> {{ u.fullName }}
      </a>
      <a *ngIf="(user$ | async)?.role === 'admin'" routerLink="/konto/schluessel" routerLinkActive="active">Schlüssel</a>
      <a *ngIf="(user$ | async)?.role === 'admin'" routerLink="/konto/fragen" routerLinkActive="active">Fragen</a>
      <a *ngIf="(user$ | async)?.role === 'admin'" routerLink="/konto/bilder" routerLinkActive="active">Bilder</a>
      <a *ngIf="(user$ | async)?.role === 'admin'" routerLink="/konto/benennen" routerLinkActive="active">Benennen</a>
      <a *ngIf="user$ | async" (click)="abmelden()" class="konto-link logout-link">
        <ion-icon name="log-out-outline"></ion-icon> Abmelden
      </a>
      <ng-template #keinKonto>
        <a routerLink="/konto/anmelden" routerLinkActive="active" class="konto-link">
          <ion-icon name="log-in-outline"></ion-icon> Anmelden
        </a>
      </ng-template>
    </nav>
    <div class="skin-row" *ngIf="zeigeSkinAuswahl">
      <app-skin-picker></app-skin-picker>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="dash-content" [fullscreen]="true">
 <div class="dash-shell home">
  <input class="home-suche" type="search" placeholder="App suchen" [value]="suche" (input)="suche = $any($event.target).value" />

  <section *ngFor="let g of gruppen; trackBy: trackGruppe" class="ordner" [style.--ordner]="g.farbe">
    <h2>{{ g.titel }}</h2>
    <div class="grid">
      <a *ngFor="let t of g.tiles; trackBy: trackByTileId" class="app" [routerLink]="t.link" [queryParams]="t.queryParams">
        <span class="icon"><ion-icon [name]="t.icon"></ion-icon></span>
        <span class="label">{{ t.title }}</span>
      </a>
    </div>
  </section>
  <p class="leer" *ngIf="gruppen.length === 0">Keine App gefunden.</p>

  <footer class="app-footer">
    <a [routerLink]="'/bildnachweise'">Bildnachweise</a>
    <a [routerLink]="'/quellenverzeichnis'">Quellenverzeichnis</a>
    <a [routerLink]="'/rechte'">Rechte an Quellen und Bildern</a>
    <a [routerLink]="'/bahnspiel-assets'">Bahnspiel-Assets</a>
  </footer>
 </div>
</ion-content>
