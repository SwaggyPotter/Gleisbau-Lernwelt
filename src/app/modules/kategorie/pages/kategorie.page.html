<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{ kategorie.title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/dashboard" fill="clear">
        <ion-icon slot="start" name="grid-outline"></ion-icon>
        <span class="toolbar-action-label">Start</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar class="nav-toolbar">
    <nav class="main-nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Start</a>
      <a routerLink="/kategorie/wissenstests" routerLinkActive="active">Wissenstests</a>
      <a routerLink="/kategorie/lernfelder" routerLinkActive="active">Lernfelder</a>
      <a routerLink="/kategorie/rechentrainer" routerLinkActive="active">Rechentrainer</a>
      <a routerLink="/kategorie/spiele" routerLinkActive="active">Spiele</a>
    </nav>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="kat-content">
  <div class="kat-shell">
    <section class="kat-head">
      <p class="eyebrow">{{ kategorie.eyebrow }}</p>
      <h1>{{ kategorie.title }}</h1>
      <p class="lede">{{ kategorie.note }}</p>
    </section>

    <section class="kat-gruppe" *ngFor="let gruppe of kategorie.gruppen; trackBy: trackByGruppe">
      <div class="gruppe-head" *ngIf="gruppe.title">
        <h2>{{ gruppe.title }}</h2>
        <p class="gruppe-note" *ngIf="gruppe.note">{{ gruppe.note }}</p>
      </div>
      <ion-grid>
        <ion-row>
          <ion-col size="12" sizeMd="6" sizeLg="4" *ngFor="let tile of gruppe.tiles; trackBy: trackByTileId">
            <ion-card class="tile-card" [routerLink]="tile.link" [queryParams]="tile.queryParams">
              <div class="tile-image" *ngIf="tile.image" [style.background-image]="tileImageStyle(tile)">
                <span class="corner c-tl" aria-hidden="true"></span>
                <span class="corner c-br" aria-hidden="true"></span>
                <div class="tile-icon overlay">
                  <ion-icon [name]="tile.icon"></ion-icon>
                </div>
                <p class="image-credit" *ngIf="tile.imageCredit">{{ tile.imageCredit }}</p>
              </div>
              <div class="tile-icon" *ngIf="!tile.image">
                <ion-icon [name]="tile.icon"></ion-icon>
              </div>
              <ion-card-header>
                <div class="tile-top">
                  <ion-chip outline="true">
                    <ion-label>{{ tile.tag }}</ion-label>
                  </ion-chip>
                </div>
                <ion-card-title>{{ tile.title }}</ion-card-title>
                <ion-card-subtitle>{{ tile.description }}</ion-card-subtitle>
              </ion-card-header>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </section>
  </div>
</ion-content>
