<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registrieren</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/dashboard" fill="clear">
        <ion-icon slot="start" name="grid-outline"></ion-icon>
        <span class="toolbar-action-label">Zur Uebersicht</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="game-content">
  <div class="page-shell">
    <section class="hero">
      <p class="eyebrow">Konto</p>
      <h1>Registrieren</h1>
      <p class="lede">Du brauchst einen Registrierungs-Schlüssel von deinem Ausbilder (Format z. B. J1-AB12).</p>
    </section>

    <ion-card class="form-card">
      <ion-card-content>
        <form (ngSubmit)="submit()">
          <ion-input
            class="field"
            label="E-Mail"
            labelPlacement="stacked"
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="username"
          ></ion-input>
          <ion-input
            class="field"
            label="Registrierungs-Schlüssel"
            labelPlacement="stacked"
            type="text"
            placeholder="z. B. J1-AB12"
            [(ngModel)]="key"
            name="key"
            required
          ></ion-input>
          <ion-input
            class="field"
            label="Passwort (mind. 8 Zeichen)"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            autocomplete="new-password"
          ></ion-input>
          <ion-input
            class="field"
            label="Passwort wiederholen"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="passwordWiederholen"
            name="passwordWiederholen"
            required
            autocomplete="new-password"
          ></ion-input>

          <p class="fehler" *ngIf="fehler">{{ fehler }}</p>

          <ion-button expand="block" type="submit" [disabled]="busy">{{ busy ? 'Bitte warten…' : 'Konto erstellen' }}</ion-button>
        </form>

        <p class="switch-link">Schon registriert? <a routerLink="/konto/anmelden">Anmelden</a></p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
