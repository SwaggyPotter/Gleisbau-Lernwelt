<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Nivellieren im Gleisbau</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/kategorie/rechentrainer" fill="clear">
        <ion-icon slot="start" name="grid-outline"></ion-icon>
        <span class="toolbar-action-label">Rechentrainer</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="nv-content">
  <div class="page-shell" *ngIf="!loading && !error; else stateBlock">
    <section class="hero">
      <div>
        <p class="eyebrow">Rechentrainer</p>
        <h1>Nivellieren im Gleisbau</h1>
        <p class="lede">Wissen zum Nivellieren im Gleisbau abfragen — Aufbau, Messen und Kontrolle.</p>
      </div>
      <div class="progress">
        <div class="stat">
          <span>Beantwortete Fragen</span>
          <strong>{{ totalAnswered() }}</strong>
        </div>
      </div>
    </section>

    <section class="quiz-section" *ngIf="quiz">
      <app-lf02-quiz-engine
        [questions]="quiz.questions"
        [shuffle]="true"
        [title]="quiz.meta.title"
        (answered)="quizAnswered($event)"
      ></app-lf02-quiz-engine>
    </section>
  </div>

  <ng-template #stateBlock>
    <ion-spinner *ngIf="loading"></ion-spinner>
    <p *ngIf="error">{{ error }}</p>
  </ng-template>
</ion-content>
