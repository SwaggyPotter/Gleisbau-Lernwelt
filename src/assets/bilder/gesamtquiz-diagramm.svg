<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#16242f"/>
  <!-- Rasterlinien -->
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Verbindungslinien zu den Modulen -->
  <g stroke="#6fa8dc" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="200" y1="150" x2="100" y2="80"/>
    <line x1="200" y1="150" x2="200" y2="60"/>
    <line x1="200" y1="150" x2="300" y2="80"/>
    <line x1="200" y1="150" x2="320" y2="160"/>
    <line x1="200" y1="150" x2="280" y2="230"/>
    <line x1="200" y1="150" x2="120" y2="230"/>
    <line x1="200" y1="150" x2="80" y2="160"/>
  </g>

  <!-- Module (aussen) -->
  <g fill="#1c2e3b" stroke="#6fa8dc" stroke-width="2">
    <circle cx="100" cy="80" r="14"/>
    <circle cx="200" cy="60" r="14"/>
    <circle cx="300" cy="80" r="14"/>
    <circle cx="320" cy="160" r="14"/>
    <circle cx="280" cy="230" r="14"/>
    <circle cx="120" cy="230" r="14"/>
    <circle cx="80" cy="160" r="14"/>
  </g>

  <!-- Zentrum: Gesamtquiz -->
  <circle cx="200" cy="150" r="30" fill="#ff8a3d" fill-opacity="0.15" stroke="#ff8a3d" stroke-width="3"/>
  <path d="M188,150 l8,8 l16,-18" fill="none" stroke="#ff8a3d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="200" y="20" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">GESAMTQUIZ — ALLE THEMEN AN EINEM ORT</text>
</svg>
