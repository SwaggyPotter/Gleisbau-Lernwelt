<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#16242f"/>
  <!-- Rasterlinien -->
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Kreismittelpunkt M -->
  <circle cx="100" cy="260" r="3.5" fill="#eaf2f5"/>
  <text x="88" y="278" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="13">M</text>

  <!-- Radienlinien vom Mittelpunkt zum Bogen -->
  <g stroke="#6fa8dc" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="100" y1="260" x2="100" y2="70"/>
    <line x1="100" y1="260" x2="290" y2="180"/>
  </g>
  <text x="60" y="165" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="14">R</text>

  <!-- Gleisbogen (Aussen- und Innenschiene) -->
  <path d="M 100,70 A 190,190 0 0 1 290,180" fill="none" stroke="#ff8a3d" stroke-width="3.5"/>
  <path d="M 118,72 A 172,172 0 0 1 273,163" fill="none" stroke="#ff8a3d" stroke-width="3.5"/>

  <!-- Schwellen quer zum Bogen (angedeutet) -->
  <g stroke="#8ca3af" stroke-width="2">
    <line x1="98" y1="70" x2="120" y2="72"/>
    <line x1="140" y1="76" x2="160" y2="83"/>
    <line x1="185" y1="95" x2="203" y2="107"/>
    <line x1="225" y1="122" x2="240" y2="137"/>
    <line x1="255" y1="150" x2="267" y2="167"/>
    <line x1="277" y1="178" x2="292" y2="183"/>
  </g>

  <!-- Winkel alpha am Mittelpunkt -->
  <path d="M 100,225 A 35,35 0 0 1 130,252" fill="none" stroke="#eaf2f5" stroke-width="1.5"/>
  <text x="120" y="230" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="13">α</text>

  <text x="200" y="20" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">GLEISBOGEN — RADIUS UND EINMESSEN</text>
</svg>
