<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#16242f"/>
  <!-- Rasterlinien -->
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Boden -->
  <line x1="20" y1="240" x2="380" y2="240" stroke="#6fa8dc" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Stativ -->
  <g stroke="#ff8a3d" stroke-width="2.5">
    <line x1="65" y1="240" x2="90" y2="155"/>
    <line x1="115" y1="240" x2="90" y2="155"/>
    <line x1="90" y1="240" x2="90" y2="160"/>
  </g>

  <!-- Nivelliergeraet -->
  <circle cx="90" cy="145" r="12" fill="#16242f" stroke="#ff8a3d" stroke-width="3"/>
  <line x1="78" y1="145" x2="120" y2="145" stroke="#ff8a3d" stroke-width="3"/>

  <!-- Ziellinie -->
  <line x1="120" y1="145" x2="310" y2="145" stroke="#6fa8dc" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Nivellierlatte -->
  <rect x="300" y="90" width="20" height="150" fill="#1c2e3b" stroke="#ff8a3d" stroke-width="2.5"/>
  <g stroke="#eaf2f5" stroke-width="1.5">
    <line x1="300" y1="110" x2="320" y2="110"/>
    <line x1="300" y1="130" x2="320" y2="130"/>
    <line x1="300" y1="150" x2="320" y2="150"/>
    <line x1="300" y1="170" x2="320" y2="170"/>
    <line x1="300" y1="190" x2="320" y2="190"/>
    <line x1="300" y1="210" x2="320" y2="210"/>
  </g>
  <circle cx="310" cy="145" r="4" fill="#ff8a3d"/>

  <text x="90" y="266" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">GERAET</text>
  <text x="310" y="266" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">LATTE</text>
  <text x="215" y="132" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">Zielstrahl</text>

  <text x="200" y="20" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">NIVELLIEREN — HOEHENUNTERSCHIED MESSEN</text>
</svg>
