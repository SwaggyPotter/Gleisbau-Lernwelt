<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#16242f"/>
  <!-- Rasterlinien -->
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Zwei gegenueberstehende Spieler-Kreise -->
  <circle cx="110" cy="160" r="42" fill="none" stroke="#ff8a3d" stroke-width="3"/>
  <circle cx="290" cy="160" r="42" fill="none" stroke="#6fa8dc" stroke-width="3"/>

  <!-- Fragezeichen in beiden Kreisen -->
  <text x="110" y="175" fill="#ff8a3d" font-family="JetBrains Mono, monospace" font-size="34" text-anchor="middle">?</text>
  <text x="290" y="175" fill="#6fa8dc" font-family="JetBrains Mono, monospace" font-size="34" text-anchor="middle">?</text>

  <!-- Konvergierende Linien zur Mitte -->
  <g stroke="#eaf2f5" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="152" y1="160" x2="180" y2="160"/>
    <line x1="248" y1="160" x2="220" y2="160"/>
  </g>

  <!-- VS-Blitz in der Mitte -->
  <polygon points="200,120 185,168 198,168 190,210 220,155 204,155 214,120"
           fill="#ff8a3d"/>

  <text x="200" y="255" fill="#eaf2f5" font-family="Oswald, sans-serif" font-size="20" letter-spacing="4" text-anchor="middle">VS</text>

  <text x="200" y="20" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">QUIZ-DUELL — GEGENEINANDER ANTRETEN</text>
</svg>
