<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#16242f"/>
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Schiene kalt (durchgezogen, kurz) -->
  <line x1="30" y1="130" x2="230" y2="130" stroke="#8ca3af" stroke-width="6"/>
  <!-- Schiene warm (gestrichelt, laenger, verschoben) -->
  <line x1="30" y1="180" x2="270" y2="180" stroke="#ff8a3d" stroke-width="6" stroke-dasharray="10 6"/>

  <!-- Ausdehnungspfeil -->
  <path d="M 230,155 L 270,155" stroke="#6fa8dc" stroke-width="2"/>
  <path d="M 260,148 L 270,155 L 260,162" fill="none" stroke="#6fa8dc" stroke-width="2"/>
  <text x="250" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#6fa8dc">ΔL</text>

  <text x="130" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8ca3af">T₁</text>
  <text x="150" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ff8a3d">T₂ &gt; T₁</text>

  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#eaf2f5">ΔL = α · l₀ · ΔT</text>
</svg>
