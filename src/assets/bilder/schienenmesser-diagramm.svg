<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#16242f"/>
  <!-- Rasterlinien -->
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Schienenkopf im Querschnitt (vereinfachtes Vignolprofil) -->
  <path d="M 140,230 C 140,180 150,150 160,150 C 152,120 158,95 200,90 C 242,95 248,120 240,150 C 250,150 260,180 260,230 Z"
        fill="#ff8a3d" fill-opacity="0.1" stroke="#ff8a3d" stroke-width="3"/>

  <!-- Messfuehler-Geraet: L-foermiger Anschlag von rechts an den Schienenkopf -->
  <g stroke="#8ca3af" stroke-width="2.5" fill="none">
    <path d="M 300,235 L 260,235 L 260,150 L 275,150"/>
    <circle cx="260" cy="150" r="4" fill="#eaf2f5"/>
    <circle cx="240" cy="150" r="4" fill="#eaf2f5"/>
  </g>

  <!-- Hoehenverschleiss: senkrechter Pfeil oben -->
  <g stroke="#6fa8dc" stroke-width="1.5">
    <line x1="200" y1="60" x2="200" y2="90"/>
    <line x1="190" y1="65" x2="200" y2="60"/>
    <line x1="210" y1="65" x2="200" y2="60"/>
  </g>
  <text x="200" y="50" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle">HOEHE</text>

  <!-- Seitenverschleiss: waagrechter Pfeil rechts -->
  <g stroke="#6fa8dc" stroke-width="1.5">
    <line x1="285" y1="150" x2="320" y2="150"/>
    <line x1="290" y1="144" x2="285" y2="150"/>
    <line x1="290" y1="156" x2="285" y2="150"/>
  </g>
  <text x="345" y="154" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle">SEITE</text>

  <!-- Schwelle -->
  <rect x="90" y="230" width="220" height="16" fill="#0f1a22" stroke="#6fa8dc" stroke-opacity="0.4" stroke-width="1"/>

  <text x="200" y="20" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">SCHIENENKOPF — HOEHEN- UND SEITENVERSCHLEISS MESSEN</text>
</svg>
