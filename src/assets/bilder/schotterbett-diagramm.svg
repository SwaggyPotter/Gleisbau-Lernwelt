<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#16242f"/>
  <!-- Rasterlinien -->
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Planum (Untergrund) -->
  <line x1="30" y1="230" x2="370" y2="230" stroke="#8ca3af" stroke-width="3"/>

  <!-- Schotterbett-Querschnitt (Boeschung + Bettungskoerper) -->
  <polygon points="110,150 290,150 340,230 60,230" fill="#ff8a3d" fill-opacity="0.1"/>
  <polyline points="60,230 110,150 290,150 340,230" fill="none" stroke="#ff8a3d" stroke-width="3"/>

  <!-- Schwelle -->
  <rect x="150" y="128" width="100" height="22" fill="#8ca3af" stroke="#eaf2f5" stroke-width="1"/>

  <!-- Bemassungslinien: Bettungsstaerke -->
  <g stroke="#6fa8dc" stroke-width="1.5">
    <line x1="320" y1="150" x2="320" y2="230"/>
    <line x1="290" y1="150" x2="325" y2="150"/>
    <line x1="340" y1="230" x2="325" y2="230"/>
  </g>

  <text x="335" y="195" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle" transform="rotate(90 335 195)">Bettungsstärke</text>
  <text x="200" y="145" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle">Schwelle</text>
  <text x="85" y="195" fill="#ff8a3d" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle">Böschung</text>

  <text x="200" y="20" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">SCHOTTERBETT-QUERSCHNITT (BEISPIEL)</text>
</svg>
