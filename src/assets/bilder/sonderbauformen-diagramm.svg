<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#16242f"/>
  <!-- Rasterlinien -->
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Links: klassischer Schotteroberbau -->
  <g>
    <polygon points="40,220 160,220 140,245 60,245" fill="#8ca3af" fill-opacity="0.25" stroke="#8ca3af" stroke-width="1.5"/>
    <rect x="70" y="205" width="60" height="12" fill="#5b6b73"/>
    <rect x="80" y="196" width="6" height="10" fill="#ff8a3d"/>
    <rect x="114" y="196" width="6" height="10" fill="#ff8a3d"/>
    <text x="100" y="270" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">SCHOTTEROBERBAU</text>
  </g>

  <!-- Rechts: Feste Fahrbahn -->
  <g>
    <rect x="240" y="215" width="120" height="30" fill="#2a3a44" stroke="#6fa8dc" stroke-width="1.5"/>
    <rect x="275" y="196" width="6" height="19" fill="#ff8a3d"/>
    <rect x="309" y="196" width="6" height="19" fill="#ff8a3d"/>
    <text x="300" y="270" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">FESTE FAHRBAHN</text>
  </g>

  <!-- Andreaskreuz (Bahnuebergang) mittig oben -->
  <g stroke="#ff8a3d" stroke-width="6" stroke-linecap="round">
    <line x1="178" y1="75" x2="222" y2="119"/>
    <line x1="222" y1="75" x2="178" y2="119"/>
  </g>
  <circle cx="200" cy="97" r="34" fill="none" stroke="#eaf2f5" stroke-width="2"/>
  <text x="200" y="145" fill="#eaf2f5" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">BAHNUEBERGANG</text>

  <text x="200" y="20" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">SONDERBAUFORMEN — FESTE FAHRBAHN, BAHNUEBERGANG</text>
</svg>
