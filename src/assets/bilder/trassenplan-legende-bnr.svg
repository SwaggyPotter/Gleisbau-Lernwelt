<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="500" height="210">
  <rect width="500" height="210" fill="#16242f"/>
  <g stroke="#6fa8dc" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="42" x2="500" y2="42"/><line x1="0" y1="84" x2="500" y2="84"/>
    <line x1="0" y1="126" x2="500" y2="126"/><line x1="0" y1="168" x2="500" y2="168"/>
    <line x1="42" y1="0" x2="42" y2="210"/><line x1="84" y1="0" x2="84" y2="210"/>
    <line x1="126" y1="0" x2="126" y2="210"/><line x1="168" y1="0" x2="168" y2="210"/>
    <line x1="210" y1="0" x2="210" y2="210"/><line x1="252" y1="0" x2="252" y2="210"/>
    <line x1="294" y1="0" x2="294" y2="210"/><line x1="336" y1="0" x2="336" y2="210"/>
    <line x1="378" y1="0" x2="378" y2="210"/><line x1="420" y1="0" x2="420" y2="210"/>
    <line x1="462" y1="0" x2="462" y2="210"/>
  </g>

  <text x="20" y="26" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">LEGENDE · BAULICHER ZUSTAND</text>

  <!-- Bestand: grau -->
  <line x1="30" y1="70" x2="150" y2="70" stroke="#898989" stroke-width="4"/>
  <text x="165" y="66" fill="#eaf2f5" font-family="Barlow, sans-serif" font-size="15" font-weight="600">Bestand</text>
  <text x="165" y="84" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="10">RGB 137 / 137 / 137</text>

  <!-- Neubau/Aenderung: rot -->
  <line x1="30" y1="115" x2="150" y2="115" stroke="#ff4d4d" stroke-width="4"/>
  <text x="165" y="111" fill="#eaf2f5" font-family="Barlow, sans-serif" font-size="15" font-weight="600">Neubau / Änderung</text>
  <text x="165" y="129" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="10">RGB 255 / 0 / 0</text>

  <!-- Rueckbau: gelb/orange -->
  <line x1="30" y1="160" x2="150" y2="160" stroke="#ffc300" stroke-width="4"/>
  <text x="165" y="156" fill="#eaf2f5" font-family="Barlow, sans-serif" font-size="15" font-weight="600">Rückbau</text>
  <text x="165" y="174" fill="#8ca3af" font-family="JetBrains Mono, monospace" font-size="10">RGB 255 / 191 / 0</text>

  <text x="480" y="200" fill="#6fa8dc" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="end" letter-spacing="0.5">nach EBA Muster-Legendenheft</text>
</svg>
